<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RG Saúde — Concierge</title>
<script src="api.js"></script>
<link rel="stylesheet" href="_core.css">
<style>
  body{background:#fff}
  .phone{background:#fff}
  .content{top:50px;bottom:var(--tab-h);background:#fff;
           display:flex;flex-direction:column;overflow:hidden}

  /* ─────────────── cabeçalho */
  .cg-head{display:flex;align-items:center;gap:9px;padding:14px 18px 12px;
           border-bottom:1px solid rgba(0,0,0,.06);flex-shrink:0;background:#fff;z-index:4}
  .cg-logo{width:26px;height:26px;border-radius:7px;background:#2563EB;color:#fff;
           display:flex;align-items:center;justify-content:center;
           font:800 11px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.02em}
  .cg-name{font:800 17px/1 'Plus Jakarta Sans',sans-serif;color:#0D0F14;letter-spacing:-.3px}
  .cg-pill{margin-left:auto;background:#EAF1FE;color:#2563EB;border-radius:20px;
           padding:5px 11px;font:800 9.5px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.13em}

  /* ─────────────── conversa */
  .cg-scroll{flex:1;overflow-y:auto;padding:16px 16px 8px;-webkit-overflow-scrolling:touch}
  .cg-scroll::-webkit-scrollbar{width:0}

  .cg-quota{display:block;width:fit-content;margin:0 auto 18px;background:#F1F2F4;color:#8A9099;
            border-radius:20px;padding:6px 14px;font:600 11px/1 'Plus Jakarta Sans',sans-serif}

  .cg-row{display:flex;margin-bottom:14px;align-items:flex-start;gap:8px}
  .cg-row.eu{justify-content:flex-end}

  .cg-av{width:20px;height:20px;flex-shrink:0;margin-top:9px}
  .cg-av svg{width:100%;height:100%;display:block}

  .cg-bub{max-width:78%;border-radius:16px;padding:12px 14px;
          font:500 13.5px/1.55 'Plus Jakarta Sans',sans-serif;
          white-space:pre-wrap;word-break:break-word}
  .cg-bub.ia{background:#EAF1FE;color:#0D0F14;border-top-left-radius:6px}
  .cg-bub.eu{background:#F1F2F4;color:#0D0F14;border-top-right-radius:6px}
  .cg-bub b{font-weight:800}

  .cg-anexo{display:inline-flex;align-items:center;gap:7px}
  .cg-anexo svg{width:14px;height:14px;stroke:#6B7280;fill:none;stroke-width:2;flex-shrink:0}

  /* digitando */
  .cg-dots{display:flex;gap:4px;padding:4px 2px}
  .cg-dots i{width:6px;height:6px;border-radius:50%;background:#9CB6E8;animation:cgB 1.1s infinite}
  .cg-dots i:nth-child(2){animation-delay:.16s}
  .cg-dots i:nth-child(3){animation-delay:.32s}
  @keyframes cgB{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* ─────────────── estado inicial */
  .cg-zero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
           padding:0 32px 40px;text-align:center}
  .cg-zero-ic{width:56px;height:56px;margin-bottom:18px}
  .cg-zero-t{font:800 21px/1.25 'Plus Jakarta Sans',sans-serif;color:#0D0F14;letter-spacing:-.5px}
  .cg-zero-s{font:500 13px/1.55 'Plus Jakarta Sans',sans-serif;color:#6B7280;margin-top:9px;max-width:250px}
  .cg-sug{display:flex;flex-direction:column;gap:8px;margin-top:26px;width:100%;max-width:280px}
  .cg-sug button{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:13px;padding:11px 14px;
                 font:600 12.5px/1.4 'Plus Jakarta Sans',sans-serif;color:#4B5563;text-align:left;
                 cursor:pointer;transition:.13s}
  .cg-sug button:hover{border-color:#2563EB;color:#2563EB}

  /* ─────────────── campo de escrever */
  .cg-comp{flex-shrink:0;padding:10px 14px 14px;background:#fff}
  .cg-box{border:1px solid rgba(0,0,0,.10);border-radius:22px;padding:12px 14px 9px;background:#fff;
          box-shadow:0 1px 6px rgba(0,0,0,.04)}
  .cg-box:focus-within{border-color:rgba(37,99,235,.45);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
  .cg-input{width:100%;border:0;outline:0;resize:none;background:transparent;max-height:96px;
            font:500 14px/1.45 'Plus Jakarta Sans',sans-serif;color:#0D0F14}
  .cg-input::placeholder{color:#9CA3AF}
  .cg-tools{display:flex;align-items:center;margin-top:8px}
  .cg-ico{width:32px;height:32px;border-radius:50%;border:0;background:transparent;cursor:pointer;
          display:flex;align-items:center;justify-content:center;color:#4B5563}
  .cg-ico:hover{background:rgba(0,0,0,.05)}
  .cg-ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;
              stroke-linecap:round;stroke-linejoin:round}
  .cg-send{width:32px;height:32px;border-radius:50%;border:0;background:#2563EB;cursor:pointer;
           display:flex;align-items:center;justify-content:center;margin-left:4px;transition:.13s}
  .cg-send:disabled{background:#D6DBE3;cursor:default}
  .cg-send svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.4;
               stroke-linecap:round;stroke-linejoin:round}
  .cg-spacer{flex:1}

  /* gravando */
  .cg-rec{display:none;align-items:center;gap:10px;padding:2px 4px}
  .cg-rec.on{display:flex}
  .cg-rec .dot{width:9px;height:9px;border-radius:50%;background:#EF4444;animation:cgP 1s infinite}
  @keyframes cgP{0%,100%{opacity:1}50%{opacity:.25}}
  .cg-rec .t{font:700 13px/1 'Plus Jakarta Sans',sans-serif;color:#0D0F14}
  .cg-wave{display:flex;gap:2.5px;align-items:center;flex:1}
  .cg-wave i{width:2.5px;background:#9CB6E8;border-radius:2px;animation:cgW .9s infinite ease-in-out}
  @keyframes cgW{0%,100%{height:5px}50%{height:17px}}

  /* ─────────────── popup do clipe */
  .cg-ov{position:absolute;inset:0;background:rgba(13,15,20,.35);z-index:60;display:none}
  .cg-ov.on{display:block}
  .cg-sheet{position:absolute;left:10px;right:10px;bottom:10px;background:#fff;border-radius:20px;
            padding:8px;transform:translateY(14px);opacity:0;transition:.22s cubic-bezier(.2,.8,.2,1)}
  .cg-ov.on .cg-sheet{transform:none;opacity:1}
  .cg-opt{display:flex;align-items:center;gap:13px;width:100%;border:0;background:transparent;
          padding:15px 14px;border-radius:14px;cursor:pointer;text-align:left}
  .cg-opt:hover{background:#F4F6FA}
  .cg-opt+.cg-opt{border-top:1px solid rgba(0,0,0,.05)}
  .cg-opt .bx{width:38px;height:38px;border-radius:11px;background:#EAF1FE;color:#2563EB;
              display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .cg-opt .bx svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;
                  stroke-linecap:round;stroke-linejoin:round}
  .cg-opt .tt{font:700 14px/1 'Plus Jakarta Sans',sans-serif;color:#0D0F14}
  .cg-opt .dd{font:500 11.5px/1.4 'Plus Jakarta Sans',sans-serif;color:#6B7280;margin-top:3px}
  .cg-cancel{margin-top:6px;width:100%;border:0;background:#F1F2F4;border-radius:14px;padding:14px;
             font:800 14px/1 'Plus Jakarta Sans',sans-serif;color:#0D0F14;cursor:pointer}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status-bar"><span>9:41</span><span class="right"><svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="1" y="1" width="20" height="9" rx="2" stroke="currentColor" stroke-opacity=".35"/><rect x="2.5" y="2.5" width="17" height="6" rx="1" fill="currentColor"/></svg></span></div>

  <div class="content">

    <div class="cg-head">
      <div class="cg-logo">RG</div>
      <div class="cg-name">Saúde</div>
      <div class="cg-pill">CONCIERGE</div>
    </div>

    <!-- estado inicial: nada digitado ainda -->
    <div class="cg-zero" id="cgZero">
      <div class="cg-zero-ic" id="cgZeroIc"></div>
      <div class="cg-zero-t">Pergunte sobre<br>a sua saúde</div>
      <div class="cg-zero-s">Seus exames, seus remédios e suas alergias já estão aqui. É só perguntar.</div>
      <div class="cg-sug">
        <button onclick="cgSugerir('minha ferritina melhorou?')">Minha ferritina melhorou?</button>
        <button onclick="cgSugerir('o que significa hemoglobina glicada 7,2?')">O que significa hemoglobina glicada 7,2?</button>
        <button onclick="cgSugerir('quais remédios eu tomo hoje?')">Quais remédios eu tomo hoje?</button>
      </div>
    </div>

    <!-- conversa -->
    <div class="cg-scroll" id="cgScroll" style="display:none">
      <span class="cg-quota">3 de 5 perguntas grátis este mês</span>
      <div id="cgMsgs"></div>
    </div>

    <!-- campo -->
    <div class="cg-comp">
      <div class="cg-box">
        <textarea class="cg-input" id="cgInput" rows="1" placeholder="Pergunte sobre sua saúde"
                  oninput="cgCresce(this)" onkeydown="cgTecla(event)"></textarea>
        <div class="cg-tools" id="cgTools">
          <button class="cg-ico" onclick="cgAbrirAnexo()" aria-label="Anexar">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <div class="cg-spacer"></div>
          <button class="cg-ico" id="cgMic" onclick="cgGravar()" aria-label="Gravar áudio">
            <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
          </button>
          <button class="cg-send" id="cgSend" disabled onclick="cgEnviar()" aria-label="Enviar">
            <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
        </div>
        <div class="cg-rec" id="cgRec">
          <span class="dot"></span>
          <span class="t" id="cgRecT">0:00</span>
          <div class="cg-wave" id="cgWave"></div>
          <button class="cg-ico" onclick="cgGravar()" aria-label="Parar">
            <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- popup do clipe -->
  <div class="cg-ov" id="cgOv" onclick="if(event.target===this)cgFecharAnexo()">
    <div class="cg-sheet">
      <button class="cg-opt" onclick="cgAnexar('doc')">
        <span class="bx"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
        <span><span class="tt">Anexar documento</span><span class="dd">Exame, receita, laudo ou atestado em PDF</span></span>
      </button>
      <button class="cg-opt" onclick="cgAnexar('galeria')">
        <span class="bx"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></span>
        <span><span class="tt">Enviar foto</span><span class="dd">Escolher da galeria do celular</span></span>
      </button>
      <button class="cg-opt" onclick="cgAnexar('camera')">
        <span class="bx"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
        <span><span class="tt">Tirar foto</span><span class="dd">Fotografar um papel agora</span></span>
      </button>
      <button class="cg-cancel" onclick="cgFecharAnexo()">Cancelar</button>
    </div>
  </div>

  <!-- TAB BAR — reescrita pelo _demo.js no modo demonstração -->
  <div class="tab-bar">
    <div class="tab" onclick="window.location.href='01-saude.html'">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="3" x2="9" y2="9"/></svg>
      <span class="tab-label">Meu RG</span>
    </div>
    <div class="tab" onclick="window.location.href='09-exames-lista.html'">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span class="tab-label">Documentos</span>
    </div>
    <div class="tab active">
      <svg viewBox="0 0 24 24"><line x1="12" y1="3" x2="12" y2="21"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"/><line x1="18.4" y1="5.6" x2="5.6" y2="18.4"/></svg>
      <span class="tab-label">Concierge</span>
    </div>
    <div class="tab" onclick="window.location.href='11-busca.html'">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/></svg>
      <span class="tab-label">Busca</span>
    </div>
    <div class="tab" onclick="window.location.href='12-qr-code.html'">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="3" height="3"/><line x1="21" y1="14" x2="21" y2="21"/><line x1="14" y1="21" x2="21" y2="21"/></svg>
      <span class="tab-label">QR Code</span>
    </div>
  </div>
</div>

<script src="_concierge-brain.js?v=2"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   Aba Concierge — a conversa
   A inteligência que responde está em _concierge-brain.js
   ═══════════════════════════════════════════════════════════════ */

const SPARK = '<svg viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round"><line x1="12" y1="2.5" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="21.5" y2="12"/><line x1="5.3" y1="5.3" x2="18.7" y2="18.7"/><line x1="18.7" y1="5.3" x2="5.3" y2="18.7"/></svg>';

const cgZero   = document.getElementById('cgZero');
const cgScroll = document.getElementById('cgScroll');
const cgMsgs   = document.getElementById('cgMsgs');
const cgInput  = document.getElementById('cgInput');
const cgSend   = document.getElementById('cgSend');

let cgHistorico = [];

function cgCresce(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,96)+'px';
  cgSend.disabled = !el.value.trim();
}
function cgTecla(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); cgEnviar(); }
}
function cgSugerir(t){ cgInput.value=t; cgCresce(cgInput); cgEnviar(); }

function cgAbrirConversa(){
  if(cgZero.style.display!=='none'){
    cgZero.style.display='none';
    cgScroll.style.display='block';
  }
}
function cgBaixo(){ cgScroll.scrollTop = cgScroll.scrollHeight; }

function cgEscapa(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function cgNegrito(s){
  return cgEscapa(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
}

function cgBolha(lado, html){
  const row=document.createElement('div');
  row.className='cg-row'+(lado==='eu'?' eu':'');
  row.innerHTML = (lado==='ia' ? `<div class="cg-av">${SPARK}</div>` : '')
                + `<div class="cg-bub ${lado}">${html}</div>`;
  cgMsgs.appendChild(row); cgBaixo();
  return row;
}

function cgDigitando(){
  const row=document.createElement('div');
  row.className='cg-row'; row.id='cgTyping';
  row.innerHTML=`<div class="cg-av">${SPARK}</div>
    <div class="cg-bub ia"><div class="cg-dots"><i></i><i></i><i></i></div></div>`;
  cgMsgs.appendChild(row); cgBaixo();
}
function cgParaDigitar(){ const t=document.getElementById('cgTyping'); if(t) t.remove(); }

async function cgEnviar(){
  const txt = cgInput.value.trim();
  if(!txt) return;
  cgAbrirConversa();
  cgBolha('eu', cgNegrito(txt));
  cgInput.value=''; cgCresce(cgInput);
  cgHistorico.push({ de:'paciente', texto:txt });

  cgDigitando();
  let resposta;
  try{
    resposta = await ConciergeBrain.responder(txt, cgHistorico);
  }catch(e){
    resposta = 'Tive um problema pra responder agora. Tenta de novo em alguns segundos.';
  }
  cgParaDigitar();

  // respostas longas viram mais de uma bolha, como no WhatsApp
  const partes = String(resposta).split('\n\n---\n\n');
  for(let i=0;i<partes.length;i++){
    if(i) await new Promise(r=>setTimeout(r,420));
    cgBolha('ia', cgNegrito(partes[i]));
  }
  cgHistorico.push({ de:'concierge', texto:resposta });
}

/* ─────────────── anexos */
function cgAbrirAnexo(){ document.getElementById('cgOv').classList.add('on'); }
function cgFecharAnexo(){ document.getElementById('cgOv').classList.remove('on'); }

function cgAnexar(tipo){
  cgFecharAnexo();
  const inp=document.createElement('input');
  inp.type='file';
  if(tipo==='doc')     inp.accept='application/pdf,image/*';
  if(tipo==='galeria') inp.accept='image/*';
  if(tipo==='camera'){ inp.accept='image/*'; inp.capture='environment'; }
  inp.onchange=async ()=>{
    const f=inp.files && inp.files[0];
    if(!f) return;
    cgAbrirConversa();
    cgBolha('eu', `<span class="cg-anexo"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>[${cgEscapa(f.name)}]</span>`);
    cgHistorico.push({ de:'paciente', texto:'[anexou '+f.name+']' });
    cgDigitando();
    await new Promise(r=>setTimeout(r,1500));
    cgParaDigitar();
    const r = ConciergeBrain.respostaAnexo(f.name);
    cgBolha('ia', cgNegrito(r));
    cgHistorico.push({ de:'concierge', texto:r });
  };
  inp.click();
}

/* ─────────────── áudio */
let cgGravando=false, cgTimer=null, cgSeg=0;
(function montaOnda(){
  const w=document.getElementById('cgWave');
  for(let i=0;i<26;i++){
    const b=document.createElement('i');
    b.style.animationDelay=(i*0.055)+'s';
    b.style.height=(5+Math.random()*12)+'px';
    w.appendChild(b);
  }
})();

async function cgGravar(){
  const rec=document.getElementById('cgRec'), tools=document.getElementById('cgTools');
  if(!cgGravando){
    cgGravando=true; cgSeg=0;
    tools.style.display='none'; rec.classList.add('on');
    document.getElementById('cgRecT').textContent='0:00';
    cgTimer=setInterval(()=>{
      cgSeg++;
      const m=Math.floor(cgSeg/60), s=String(cgSeg%60).padStart(2,'0');
      document.getElementById('cgRecT').textContent=m+':'+s;
    },1000);
    try{ await navigator.mediaDevices.getUserMedia({audio:true}); }catch(_){}
  }else{
    cgGravando=false; clearInterval(cgTimer);
    rec.classList.remove('on'); tools.style.display='flex';
    const m=Math.floor(cgSeg/60), s=String(cgSeg%60).padStart(2,'0');
    cgAbrirConversa();
    cgBolha('eu', `<span class="cg-anexo"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2"/></svg>Áudio · ${m}:${s}</span>`);
    cgDigitando();
    await new Promise(r=>setTimeout(r,1400));
    cgParaDigitar();
    const r='Ouvi seu áudio. Em modo demonstração eu não transcrevo de verdade — mas no app o que você fala vira texto e entra no seu histórico do mesmo jeito.\n\nPode me perguntar por escrito que eu respondo com os seus dados.';
    cgBolha('ia', cgNegrito(r));
  }
}

/* ─────────────── ícone do estado inicial */
document.getElementById('cgZeroIc').innerHTML =
  '<svg viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round">'
  +'<line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/>'
  +'<line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>';

cgInput.focus();
</script>
</body>
</html>
